<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poker de Quinta 2027</title>

<meta name="theme-color" content="#1a2e1f">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./styles.css">
</head>

<body>

<header class="app-header">
  <div class="app-header__brand">
    <span class="app-header__logo">♠</span>
    <div>
      <h1 class="app-header__title">Poker de Quinta</h1>
      <p class="app-header__subtitle">Temporada 2027</p>
    </div>
  </div>
</header>

<main class="app-main">

  <section class="next-stage" id="nextStageSection">
    <div class="next-stage__badge" id="nextStageBadge">—</div>
    <h2 class="next-stage__title section-title">Próxima Etapa</h2>

    <div class="next-stage__card">
      <p class="next-stage__date" id="nextStageDate">Carregando…</p>
      <p class="next-stage__desc" id="nextStageDesc"></p>
      <dl class="info-grid" id="nextStageInfo"></dl>

      <a class="btn btn--primary btn--block"
         id="nextStageCta"
         href="https://pokerdequinta.github.io/confirma/">
        Fazer Inscrição
      </a>
    </div>
  </section>

  <section class="history">
    <h2 class="section-title">Histórico de Etapas</h2>
    <nav class="stage-tabs" id="stageTabs"></nav>
    <div id="stageContent" class="stage-content"></div>
  </section>

</main>

<nav class="bottom-nav">
  <a href="https://pokerdequinta.github.io/ranking/" class="bottom-nav__item">
    <span class="bottom-nav__icon">🏆</span><span class="bottom-nav__label">Ranking</span>
  </a>
  <a href="https://pokerdequinta.github.io/confirma/" class="bottom-nav__item">
    <span class="bottom-nav__icon">✅</span><span class="bottom-nav__label">Inscrição</span>
  </a>
  <a href="./regulamento.html" class="bottom-nav__item">
    <span class="bottom-nav__icon">📋</span><span class="bottom-nav__label">Regulamento</span>
  </a>
  <button class="bottom-nav__item bottom-nav__item--menu" id="moreBtn">
    <span class="bottom-nav__icon">⋯</span><span class="bottom-nav__label">Mais</span>
  </button>
</nav>

<div class="sheet-overlay" id="sheetOverlay" hidden></div>
<aside class="sheet" id="moreSheet" hidden>
  <div class="sheet__handle"></div>
  <a href="https://pokerdequinta.github.io/calendario/" class="sheet__item"><span>📆</span> Calendário</a>
  <a href="https://pokerdequinta.github.io/novidades/" class="sheet__item"><span>🎉</span> Novidades 2027</a>
  <a href="https://pokerdequinta.github.io/dealer/" class="sheet__item"><span>🎲</span> Dealer Pid</a>
  <a href="https://forms.gle/yG2MAeQvSco46DK49" class="sheet__item"><span>📸</span> Cadastro PIX</a>
  <a href="https://pokerdequinta.github.io/loja/" class="sheet__item"><span>🛒</span> Loja</a>
  <a href="https://pokerdequinta.github.io/endereco/" class="sheet__item"><span>📍</span> Localização</a>
  <a href="./admin.html" class="sheet__item sheet__item--admin"><span>⚙️</span> Admin</a>
</aside>

<footer class="app-footer">
  <p>© 2027 Poker de Quinta — Todos os direitos reservados</p>
  <p class="app-footer__suits">♠ ♥ ♦ ♣</p>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
