<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2e1f">
  <title>Sem conexão — Poker de Quinta</title>
  <style>
    :root {
      --bg: #1a2e1f;
      --surface: #2a4531;
      --gold: #e0b13a;
      --gold-light: #f5d472;
      --text: #f8faf8;
      --muted: #b8c4b8;
      --border: rgba(212, 161, 33, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(224, 177, 58, 0.12), transparent 42%),
        radial-gradient(circle at 90% 100%, rgba(95, 191, 111, 0.08), transparent 42%),
        var(--bg);
    }
    .card {
      width: min(100%, 480px);
      padding: clamp(28px, 7vw, 48px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(160deg, rgba(42, 69, 49, 0.78), rgba(26, 46, 31, 0.92));
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }
    img { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(245,212,114,.35); object-fit: cover; }
    .eyebrow { color: var(--gold); font-size: 0.67rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; }
    h1 { margin: 14px 0 0; font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.045em; line-height: 1.05; }
    h1 span { color: var(--gold-light); }
    p { margin: 16px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
    a, button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border: 1px solid transparent;
      border-radius: 999px;
      font: inherit;
      font-size: .84rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button { color: #1a2e1f; background: linear-gradient(135deg, var(--gold-light), var(--gold)); }
    a { color: var(--text); border-color: var(--border); background: rgba(42, 69, 49, .5); }
    .foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(212,161,33,.14); color: #7f9382; font-size: .65rem; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo%20pdq.png" alt="" width="76" height="76">
    <p class="eyebrow">Poker de Quinta</p>
    <h1>Você está <span>offline.</span></h1>
    <p>A mesa continua lá. Assim que a conexão voltar, é só recarregar para ver a próxima etapa, o ranking e as novidades da temporada.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <a href="./index.html">Ir para o início</a>
    </div>
    <p class="foot">Temporada 2027 · Jogue com responsabilidade · +18</p>
  </main>
</body>
</html>
