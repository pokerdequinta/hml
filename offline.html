<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Poker de Quinta</title>
<meta name="theme-color" content="#1a2e1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#1a2e1f;
    --color-bg-elevated:#223a28;
    --color-surface:#2a4531;
    --color-brand:#e0b13a;
    --color-brand-light:#f5d472;
    --color-text:#f8faf8;
    --color-text-muted:#b8c4b8;
    --color-border-soft:rgba(212,161,33,0.18);
    --font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:24px;
    font-family:var(--font-family);
    color:var(--color-text);
    background:
      radial-gradient(circle at 10% 0%, rgba(224,177,58,0.10), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(95,191,111,0.08), transparent 45%),
      var(--color-bg);
    text-align:center;
  }
  .card{
    width:min(100%, 420px);
    padding:32px 24px;
    border-radius:20px;
    border:1px solid var(--color-border-soft);
    background:linear-gradient(160deg, var(--color-surface), var(--color-bg-elevated));
    box-shadow:0 25px 70px rgba(0,0,0,0.45);
  }
  .mark{
    width:64px;height:64px;margin:0 auto 20px;
    display:grid;place-items:center;
    border-radius:16px;
    font-size:32px;font-weight:700;line-height:1;
    color:#1a2e1f;
    background:linear-gradient(135deg, var(--color-brand), var(--color-brand-light));
    box-shadow:0 8px 24px rgba(224,177,58,0.25);
  }
  h1{
    margin:0 0 10px;
    font-size:1.4rem;
    letter-spacing:-0.01em;
  }
  p{
    margin:0 0 22px;
    color:var(--color-text-muted);
    font-size:0.9rem;
    line-height:1.6;
  }
  button{
    font:inherit;
    font-weight:600;
    letter-spacing:0.05em;
    padding:12px 22px;
    border-radius:9999px;
    border:0;
    cursor:pointer;
    color:#1a2e1f;
    background:linear-gradient(135deg, var(--color-brand), var(--color-brand-light));
    box-shadow:0 8px 24px rgba(224,177,58,0.25);
    transition:transform 150ms ease, box-shadow 200ms ease;
  }
  button:hover{box-shadow:0 8px 24px rgba(224,177,58,0.25), 0 0 20px rgba(245,212,114,0.30)}
  button:active{transform:scale(0.97)}
</style>
</head>
<body>
  <div class="card" role="alert">
    <div class="mark" aria-hidden="true">&#9824;</div>
    <h1>Você está offline</h1>
    <p>
      Não foi possível conectar à internet. Verifique sua conexão
      e tente novamente para acessar o Poker de Quinta.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
