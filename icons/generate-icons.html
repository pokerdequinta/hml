<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gerar ícones PNG — Poker de Quinta</title>
<style>
  body{
    font-family: system-ui, -apple-system, sans-serif;
    background:#1a2e1f;color:#f8faf8;
    display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center;
  }
  .box{
    max-width:480px;
    padding:32px 24px;border-radius:20px;
    background:#223a28;border:1px solid rgba(212,161,33,.18);
  }
  h1{margin:0 0 12px;font-size:1.25rem;color:#f5d472}
  p{margin:0 0 20px;color:#b8c4b8;font-size:.9rem;line-height:1.6}
  button{
    font:inherit;font-weight:600;padding:12px 22px;border-radius:9999px;border:0;cursor:pointer;
    background:linear-gradient(135deg,#e0b13a,#f5d472);color:#1a2e1f;
    margin:4px;box-shadow:0 8px 24px rgba(224,177,58,.25);
  }
  button:active{transform:scale(.97)}
  .preview{margin-top:24px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .preview img{border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
  <div class="box">
    <h1>Gerar ícones PNG</h1>
    <p>
      Clique nos botões abaixo para baixar <strong>icon-192.png</strong> e
      <strong>icon-512.png</strong>. Salve ambos na pasta <code>icons/</code>
      do seu projeto, ao lado do <code>icon.svg</code>.
    </p>

    <button onclick="download(192)">Baixar 192×192</button>
    <button onclick="download(512)">Baixar 512×512</button>

    <div class="preview">
      <img id="p192" width="96" height="96" alt="Preview 192">
      <img id="p512" width="128" height="128" alt="Preview 512">
    </div>
  </div>

<script>
const SVG = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223a28"/>
      <stop offset="100%" stop-color="#1a2e1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0b13a"/>
      <stop offset="100%" stop-color="#f5d472"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#e0b13a" stroke-opacity="0.18" stroke-width="4"/>
  <path d="M256 108 C 256 108, 150 200, 150 268 C 150 312, 184 340, 220 340 C 238 340, 250 330, 256 316 C 262 330, 274 340, 292 340 C 328 340, 362 312, 362 268 C 362 200, 256 108, 256 108 Z" fill="url(#gold)"/>
  <path d="M256 330 L 256 400" stroke="#e0b13a" stroke-width="16" stroke-linecap="round"/>
  <path d="M212 412 L 300 412" stroke="#e0b13a" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="252" r="26" fill="#1a2e1f"/>
  <text x="256" y="266" text-anchor="middle" font-family="Space Grotesk, system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#gold)">Q</text>
</svg>`;

function svgToPng(size, cb){
  const blob = new Blob([SVG], {type:'image/svg+xml;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const img  = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    canvas.toBlob((pngBlob) => cb(pngBlob), 'image/png');
  };
  img.onerror = (e) => { console.error('Erro ao carregar SVG', e); URL.revokeObjectURL(url); };
  img.src = url;
}

function download(size){
  svgToPng(size, (pngBlob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(pngBlob);
    a.download = `icon-${size}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  });
}

// Previews
svgToPng(192, (blob) => {
  document.getElementById('p192').src = URL.createObjectURL(blob);
});
svgToPng(512, (blob) => {
  document.getElementById('p512').src = URL.createObjectURL(blob);
});
</script>
</body>
</html>
